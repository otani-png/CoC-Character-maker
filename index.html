<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>CoC キャラシメーカー — クトゥルフ神話TRPG 6版</title>
<style>
:root {

  --surface: #161625;
  --surface2: #1e1e30;
  --border: #2a2a40;
  --accent: #7c5cbf;
  --accent2: #a07de0;
  --danger: #c0392b;
  --green: #27ae60;
  --text: #ddd8f0;
  --muted: #888;
  --gold: #c9a84c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
  font-size: 14px;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #0d0d14 0%, #1a0d2e 100%);
  border-bottom: 1px solid var(--accent);
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.header h1 {
  font-size: 22px;
  color: var(--accent2);
  letter-spacing: 0.05em;
}
.header .subtitle {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}
.octopus { font-size: 36px; line-height: 1; filter: hue-rotate(200deg); }
.main { display: flex; min-height: calc(100vh - 80px); }
.sidebar {
  width: 280px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.sidebar h2 {
  font-size: 13px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 4px;
}
.field-group { display: flex; flex-direction: column; gap: 6px; }
.field-group label { font-size: 12px; color: var(--muted); }
select, input {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 8px 10px;
  font-size: 13px;
  width: 100%;
  outline: none;
  cursor: pointer;
  transition: border-color 0.2s;
}
select:hover, input:hover { border-color: var(--accent); }
select:focus, input:focus { border-color: var(--accent2); }
.btn-generate {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  padding: 14px;
  width: 100%;
  cursor: pointer;
  letter-spacing: 0.05em;
  transition: opacity 0.2s, transform 0.1s;
  margin-top: 8px;
}
.btn-generate:hover { opacity: 0.9; }
.btn-generate:active { transform: scale(0.98); }
.btn-small {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 12px;
  padding: 8px 12px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  width: 100%;
  text-align: left;
}
.btn-small:hover { border-color: var(--accent); background: var(--surface); }
.btn-cocofolia {
  background: linear-gradient(135deg, #1a3a5c, #2980b9);
  border: none;
  border-radius: 6px;
  color: white;
  font-size: 13px;
  padding: 10px 12px;
  cursor: pointer;
  transition: opacity 0.2s;
  width: 100%;
  font-weight: bold;
}
.btn-cocofolia:hover { opacity: 0.85; }
.content {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
}
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 60vh;
  color: var(--muted);
  gap: 12px;
}
.empty-state .big { font-size: 64px; filter: grayscale(0.5); opacity: 0.4; }
.empty-state p { font-size: 16px; }
.sheet { display: none; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.sheet-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 12px;
}
.name-block .char-name {
  font-size: 28px;
  font-weight: bold;
  color: var(--accent2);
}
.name-block .char-meta {

  color: var(--muted);
  margin-top: 4px;
}
.badge {

  color: white;
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: bold;
}
.derived-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.derived-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  text-align: center;
  min-width: 70px;
}
.derived-item .d-label { font-size: 10px; color: var(--muted); }
.derived-item .d-val { font-size: 22px; font-weight: bold; color: var(--gold); margin-top: 2px; }
.derived-item.san .d-val { color: #6ab8ff; }
.derived-item.hp .d-val { color: #e74c3c; }
.derived-item.mp .d-val { color: #3498db; }
.section-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
@media (max-width: 900px) { .section-grid { grid-template-columns: 1fr; } }
.card {

  padding: 16px;

.card h3 {

  letter-spacing: 0.1em;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);

.stat-grid {

  grid-template-columns: repeat(4, 1fr);
  gap: 8px;

.stat-box {

  padding: 8px;

.skill-name { flex: 1; font-size: 12px; }

  color: var(--muted);

  letter-spacing: 0.1em;

.toast {

.sidebar-divider {

.tips { font-size: 11px; color: var(--muted); line-height: 1.5; }

// ============================
// UTILS
// ============================
function d6() { return Math.floor(Math.random() * 6) + 1; }
function r3d6() { return d6()+d6()+d6(); }
function r2d6p6() { return d6()+d6()+6; }
function r3d6p3() { return Math.min(d6()+d6()+d6()+3, 18); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function damageBonus(str, siz) {
  const t = str + siz;
  if (t <= 12) return '-1d6';
  if (t <= 16) return '-1d4';
  if (t <= 24) return '0';
  if (t <= 32) return '+1d4';
  if (t <= 40) return '+1d6';
  return '+2d6';
}

function distributePoints(skillNames, total, currentSkills) {
  const result = {};
  skillNames.forEach(s => result[s] = currentSkills[s] ?? ALL_SKILLS[s] ?? 1);
  if (!skillNames.length || total <= 0) return result;

  const weights = skillNames.map(() => Math.random() * 0.8 + 0.2);
  const wSum = weights.reduce((a, b) => a + b, 0);
  let allocs = weights.map(w => Math.round(total * w / wSum));
  const aSum = allocs.reduce((a, b) => a + b, 0);
  allocs[allocs.length - 1] += total - aSum;

  let leftover = 0;
  skillNames.forEach((name, i) => {
    const base = result[name];
    const maxAdd = Math.max(0, 90 - base);
    const add = clamp(allocs[i] + leftover, 0, maxAdd);
    leftover = allocs[i] + leftover - add;
    result[name] = base + add;
  });

  // pour leftover into any skill with room
  if (leftover > 0) {
    for (const name of [...skillNames].sort(() => Math.random()-0.5)) {
      if (leftover <= 0) break;
      const space = 90 - result[name];
      if (space > 0) {
        const add = Math.min(space, leftover);
        result[name] += add;
        leftover -= add;
      }
    }
  }
  return result;
}

// ============================
// GENERATION
// ============================
function generateCharacter() {
  const sexSel = document.getElementById('sel-sex').value;
  const jobSel = document.getElementById('sel-job').value;
  const ageSel = document.getElementById('inp-age').value;

  const sex = sexSel === 'random' ? pick(['男性','女性']) : sexSel;
  const isMale = sex === '男性';
  const name = pick(LAST_NAMES) + ' ' + pick(isMale ? FIRST_M : FIRST_F);
  const age = ageSel ? parseInt(ageSel) : Math.floor(Math.random() * 48) + 18;

  const stats = {
    STR: r3d6(), CON: r3d6(), POW: r3d6(), DEX: r3d6(),
    APP: r3d6(), SIZ: r2d6p6(), INT: r2d6p6(), EDU: r3d6p3(),
  };

  const HP = Math.floor((stats.CON + stats.SIZ) / 2);
  const MP = stats.POW;
  const SAN = stats.POW * 5;
  const Luck = stats.POW * 5;
  const Idea = stats.INT * 5;
  const Know = stats.EDU * 5;
  const DB = damageBonus(stats.STR, stats.SIZ);

  const occ = jobSel === 'random'
    ? pick(OCCUPATIONS)
    : OCCUPATIONS.find(o => o.name === jobSel) || pick(OCCUPATIONS);

  // Build base skills
  let skills = {};
  Object.keys(ALL_SKILLS).forEach(k => {
    skills[k] = ALL_SKILLS[k];
  });
  skills['回避'] = stats.DEX * 2;
  skills['母国語'] = stats.EDU * 5;

  // Occupation skill points
  const occPts = occ.points(stats);
  const occUpdates = distributePoints(occ.primarySkills, occPts, skills);
  Object.assign(skills, occUpdates);

  // Credit rating from occupation range
  skills['信用'] = Math.floor(
    Math.random() * (occ.creditMax - occ.creditMin) + occ.creditMin
  );

  // Hobby skill points (INT×10) on non-primary skills
  const hobbyPts = stats.INT * 10;
  const hobbyPool = Object.keys(skills).filter(k =>
    !occ.primarySkills.includes(k) && k !== 'クトゥルフ神話' && k !== '母国語' && k !== '信用'
  );
  const hobbyPick = [...hobbyPool].sort(() => Math.random() - 0.5).slice(0, 6);
  const hobbyUpdates = distributePoints(hobbyPick, hobbyPts, skills);
  Object.assign(skills, hobbyUpdates);

  return {
    name, sex, age,
    occupation: occ.name,
    occDesc: occ.desc,
    primarySkills: occ.primarySkills,
    stats, skills,
    derived: { HP, MP, SAN, Luck, Idea, Know, DB },
    occPts, hobbyPts,
  };
}

// ============================
// RENDER
// ============================
let currentChar = null;

function renderSheet(c) {
  const sheet = document.getElementById('sheet');
  const { stats: s, derived: d, skills: sk, primarySkills } = c;

  const skillRowsHtml = SKILL_CATEGORIES.map(cat => {
    const rows = cat.keys.filter(k => k in sk).map(k => {
      const val = sk[k];
      const isPrimary = primarySkills.includes(k);
      const pct = Math.min(val, 90);
      const barClass = val >= 80 ? 'master' : val >= 60 ? 'high' : '';
      return `
        <div class="skill-row${isPrimary ? ' primary' : ''}">
          <span class="skill-name">${k}</span>
          <div class="skill-bar-bg"><div class="skill-bar-fill ${barClass}" style="width:${pct}%"></div></div>
          <span class="skill-val">${val}</span>
        </div>`;
    }).join('');
    return `<div class="section-label">${cat.label}</div>${rows}`;
  }).join('');

  sheet.innerHTML = `
    <div class="sheet-header">
      <div class="name-block">
        <div class="char-name">${c.name}</div>
        <div class="char-meta">${c.sex}・${c.age}歳・<span class="badge">${c.occupation}</span></div>
        <div class="char-meta" style="margin-top:6px;color:var(--muted)">${c.occDesc}</div>
        <div class="derived-row">
          <div class="derived-item hp"><div class="d-label">HP</div><div class="d-val">${d.HP}</div></div>
          <div class="derived-item mp"><div class="d-label">MP</div><div class="d-val">${d.MP}</div></div>
          <div class="derived-item san"><div class="d-label">SAN</div><div class="d-val">${d.SAN}</div></div>
          <div class="derived-item"><div class="d-label">幸運</div><div class="d-val">${d.Luck}</div></div>
          <div class="derived-item"><div class="d-label">アイデア</div><div class="d-val">${d.Idea}</div></div>
          <div class="derived-item"><div class="d-label">知識</div><div class="d-val">${d.Know}</div></div>
        </div>
      </div>
    </div>
    <div class="section-grid">
      <div class="card">
        <h3>能力値</h3>
        <div class="stat-grid">
          ${['STR','CON','POW','DEX','APP','SIZ','INT','EDU'].map(k => `
          <div class="stat-box">
            <div class="s-name">${k}</div>
            <div class="s-val">${s[k]}</div>
            <div class="s-x5">×5 = ${s[k]*5}</div>
          </div>`).join('')}
        </div>
        <div class="db-box" style="margin-top:12px">
          <span>ダメージボーナス</span>
          <span class="db-val">${d.DB}</span>
        </div>
      </div>
      <div class="card">
        <h3>職業技能（太字が職業技能）</h3>
        <div class="skills-grid">
          ${primarySkills.filter(k => k in sk).map(k => {
            const val = sk[k];
            const pct = Math.min(val, 90);
            const barClass = val >= 80 ? 'master' : val >= 60 ? 'high' : '';
            return `
            <div class="skill-row primary">
              <span class="skill-name">${k}</span>
              <div class="skill-bar-bg"><div class="skill-bar-fill ${barClass}" style="width:${pct}%"></div></div>
              <span class="skill-val">${val}</span>
            </div>`;
          }).join('')}
        </div>
        <div style="margin-top:10px;font-size:11px;color:var(--muted)">
          職業技能P: ${c.occPts} &nbsp;|&nbsp; 趣味技能P: ${c.hobbyPts}
        </div>
      </div>
      <div class="card skills-full-card">
        <h3>全技能</h3>
        <div class="skills-all-grid">
          ${skillRowsHtml}
        </div>
      </div>
    </div>
  `;

  document.getElementById('empty').style.display = 'none';
  sheet.style.display = 'block';
}

// ============================
// EXPORT
// ============================
function buildText(c) {
  const { stats: s, derived: d, skills: sk, primarySkills } = c;
  const lines = [
    '=== クトゥルフ神話TRPG キャラクターシート ===',
    `名前: ${c.name}　性別: ${c.sex}　年齢: ${c.age}歳`,
    `職業: ${c.occupation}`,
    '',
    '--- 能力値 ---',
    `STR:${s.STR}  CON:${s.CON}  POW:${s.POW}  DEX:${s.DEX}`,
    `APP:${s.APP}  SIZ:${s.SIZ}  INT:${s.INT}  EDU:${s.EDU}`,
    `HP:${d.HP}  MP:${d.MP}  SAN:${d.SAN}  幸運:${d.Luck}`,
    `アイデア:${d.Idea}  知識:${d.Know}  DB:${d.DB}`,
    '',
    '--- 技能（職業技能＊） ---',
  ];
  SKILL_CATEGORIES.forEach(cat => {
    const relevant = cat.keys.filter(k => k in sk && (sk[k] > (ALL_SKILLS[k] ?? 0) + 5 || primarySkills.includes(k)));
    if (!relevant.length) return;
    lines.push(`[${cat.label}]`);
    relevant.forEach(k => {
      const mark = primarySkills.includes(k) ? '＊' : '　';
      lines.push(`  ${mark}${k}: ${sk[k]}`);
    });
  });
  return lines.join('\n');
}

function buildCocofoliaJson(c) {
  const { stats: s, derived: d, skills: sk } = c;

  const memo = [
    `職業: ${c.occupation}　性別: ${c.sex}　年齢: ${c.age}歳`,
    '',
    `STR:${s.STR}  CON:${s.CON}  POW:${s.POW}  DEX:${s.DEX}`,
    `APP:${s.APP}  SIZ:${s.SIZ}  INT:${s.INT}  EDU:${s.EDU}`,
    `DB:${d.DB}　幸運:${d.Luck}　アイデア:${d.Idea}　知識:${d.Know}`,
  ].join('\n');

  const commands = Object.entries(sk)
    .filter(([, v]) => v > 0)
    .sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `1D100<=${v} ${k}`)
    .join('\n');

  return JSON.stringify({
    kind: 'character',
    data: {
      name: c.name,
      initiative: 0,
      externalUrl: '',
      memo,
      size: 1,
      width: 1,
      height: 1,
      x: 0,
      y: 0,
      angle: 0,
      alpha: 1,
      color: '#ffffff',
      commands,
      secret: false,
      invisible: false,
      hideStatus: false,
      iconUrl: '',
      params: [
        { name: 'HP',  value: String(d.HP),  max: String(d.HP)  },
        { name: 'MP',  value: String(d.MP),  max: String(d.MP)  },
        { name: 'SAN', value: String(d.SAN), max: String(d.SAN) },
      ],
      statuses: [],
      tokens: [],
    },
  });
}

function copyToClipboard(text, msg) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => showToast(msg));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); showToast(msg); }
    catch { showToast('コピーに失敗しました。手動でコピーしてください'); }
    document.body.removeChild(ta);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================
// INIT
// ============================
function init() {
  const sel = document.getElementById('sel-job');
  OCCUPATIONS.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.name;
    opt.textContent = o.name;
    sel.appendChild(opt);
  });

  document.getElementById('btn-gen').addEventListener('click', () => {
    currentChar = generateCharacter();
    renderSheet(currentChar);
  });

  document.getElementById('btn-copy-text').addEventListener('click', () => {
    if (!currentChar) { showToast('先にキャラクターを生成してください'); return; }
    copyToClipboard(buildText(currentChar), 'テキストをコピーしました！');
  });

  document.getElementById('btn-cocofolia').addEventListener('click', () => {
    if (!currentChar) { showToast('先にキャラクターを生成してください'); return; }
    copyToClipboard(buildCocofoliaJson(currentChar), 'ココフォリア駒データをコピーしました！');
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
