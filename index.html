<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深淵の書 — クトゥルフ神話TRPG</title>
<style>
:root {
  --bg:      #16200f;
  --stone-d: #1e2c16;
  --stone:   #263820;
  --stone-l: #2e4428;
  --stone-ll:#385230;
  --gold:    #d4b040;
  --gold2:   #f0d060;
  --moss:    #4e7a32;
  --moss2:   #72aa4a;
  --text:    #eedcaa;
  --text-dim:#9aaa78;
  --border:  #344a24;
  --border2: #4e6a34;
  --border-g:#7a6020;
  --hp:      #cc4030;
  --mp:      #3068c0;
  --san:     #5080be;
  --parchment:#dece98;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Hiragino Mincho ProN','Yu Mincho','MS Mincho','Georgia',serif;
  font-size:14px;
  min-height:100vh;
  background-image:
    radial-gradient(ellipse at 15% 30%, rgba(58,94,40,.07) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 70%, rgba(200,160,48,.04) 0%,transparent 50%);
}

/* ── GATE HEADER ── */
.gate{
  position:relative;
  background:linear-gradient(180deg,#050804 0%,#0d1409 60%,#111810 100%);
  border-bottom:1px solid var(--border2);
  padding:28px 24px 22px;
  text-align:center;
  overflow:hidden;
}
.gate::before,.gate::after{
  content:'';
  position:absolute;
  top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,transparent,var(--gold),transparent);
  opacity:.4;
}
.gate::before{left:20px}
.gate::after{right:20px}
.gate-rune{
  font-size:11px;letter-spacing:6px;color:var(--gold);opacity:.5;
  margin-bottom:8px;font-style:normal;font-family:monospace;
}
.gate h1{
  font-size:30px;letter-spacing:.25em;color:var(--gold2);
  text-shadow:0 0 30px rgba(200,160,48,.4),0 2px 4px rgba(0,0,0,.8);
  font-weight:normal;margin-bottom:4px;
}
.gate-sub{
  font-size:10px;letter-spacing:.35em;color:var(--text-dim);
  text-transform:uppercase;margin-bottom:14px;
}
.gate-line{
  display:flex;align-items:center;justify-content:center;gap:10px;
  color:var(--border2);font-size:12px;
}
.gate-line::before,.gate-line::after{
  content:'';flex:1;max-width:100px;
  height:1px;background:linear-gradient(90deg,transparent,var(--border2));
}
.gate-line::after{background:linear-gradient(90deg,var(--border2),transparent)}

/* ── CONTROLS ── */
.controls{
  background:var(--stone-d);
  border-bottom:1px solid var(--border);
  padding:14px 20px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.ctrl-group{display:flex;align-items:center;gap:6px}
.ctrl-label{font-size:11px;color:var(--text-dim);letter-spacing:.05em;white-space:nowrap}
select,input{
  background:var(--stone-l);
  border:1px solid var(--border2);
  border-radius:3px;
  color:var(--text);
  padding:6px 8px;font-size:12px;
  font-family:inherit;outline:none;cursor:pointer;
  transition:border-color .2s;
}
select:hover,input:hover{border-color:var(--gold)}
select:focus,input:focus{border-color:var(--gold2)}
input[type=number]{width:70px}
.spacer{flex:1}
.btn-gen{
  background:linear-gradient(135deg,var(--moss),var(--moss2));
  border:1px solid var(--moss2);
  border-radius:4px;color:#fff;
  font-size:14px;font-weight:bold;font-family:inherit;
  padding:8px 22px;cursor:pointer;
  letter-spacing:.1em;
  transition:opacity .2s,transform .1s;
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}
.btn-gen:hover{opacity:.85}
.btn-gen:active{transform:scale(.97)}
.btn-sm{
  background:var(--stone-l);
  border:1px solid var(--border2);
  border-radius:3px;color:var(--text);
  font-size:11px;font-family:inherit;
  padding:6px 12px;cursor:pointer;
  transition:border-color .2s,background .2s;
}
.btn-sm:hover{border-color:var(--gold);background:var(--stone-ll)}
.btn-coco{
  background:linear-gradient(135deg,#1a3060,#2858b0);
  border:1px solid #3070c0;
  border-radius:3px;color:#a8c8f0;
  font-size:11px;font-family:inherit;
  padding:6px 12px;cursor:pointer;
  transition:opacity .2s;
}
.btn-coco:hover{opacity:.85}

/* ── CONTENT ── */
.content{padding:24px;max-width:960px;margin:0 auto}
.empty-state{
  text-align:center;padding:80px 20px;color:var(--text-dim);
}
.empty-glyph{font-size:48px;opacity:.25;margin-bottom:16px}
.empty-state p{font-size:15px;letter-spacing:.1em}
.empty-state small{font-size:11px;opacity:.6;margin-top:8px;display:block;letter-spacing:.15em}

/* ── STONE CARD ── */
.slab{
  background:var(--stone);
  border:1px solid var(--border);
  border-radius:3px;
  position:relative;
  overflow:hidden;
}
.slab::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.4;
}
.slab-title{
  font-size:10px;letter-spacing:.2em;color:var(--gold);
  text-transform:uppercase;padding:10px 14px 0;opacity:.7;
}

/* ── CHARACTER HEADER ── */
.char-header{
  border:1px solid var(--border2);
  border-radius:4px;
  background:linear-gradient(135deg,var(--stone-d) 0%,var(--stone-l) 100%);
  padding:20px 24px;margin-bottom:16px;
  position:relative;overflow:hidden;
}
.char-header::after{
  content:'';position:absolute;
  bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.3;
}
.char-name{
  font-size:32px;letter-spacing:.15em;color:var(--gold2);
  text-shadow:0 0 20px rgba(200,160,48,.3);
  line-height:1;
}
.char-meta{
  display:flex;align-items:center;gap:8px;
  margin-top:8px;flex-wrap:wrap;
}
.meta-tag{
  font-size:11px;color:var(--text-dim);letter-spacing:.05em;
}
.occ-badge{
  background:var(--moss);
  border:1px solid var(--moss2);
  border-radius:2px;
  padding:2px 10px;font-size:12px;color:#b0d890;
  letter-spacing:.1em;
}
.derived-row{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;
}
.d-box{
  border:1px solid var(--border2);border-radius:3px;
  padding:8px 14px;text-align:center;min-width:72px;
  background:var(--stone-d);
  position:relative;overflow:hidden;
}
.d-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:var(--gold);opacity:.2;
}
.d-box .dl{font-size:9px;letter-spacing:.15em;color:var(--text-dim);text-transform:uppercase}
.d-box .dv{font-size:24px;font-weight:bold;margin-top:2px}
.d-box.hp .dv{color:var(--hp)}
.d-box.mp .dv{color:var(--mp)}
.d-box.san .dv{color:var(--san)}
.d-box .dv{color:var(--gold2)}

/* ── GRID ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}

/* ── STATS ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 14px}
.stat-box{
  background:var(--stone-d);border:1px solid var(--border);
  border-radius:3px;text-align:center;padding:8px 6px;
}
.stat-box .sn{font-size:10px;color:var(--text-dim);letter-spacing:.1em}
.stat-box .sv{font-size:28px;color:var(--gold2);line-height:1.1}
.stat-box .sx{font-size:9px;color:var(--text-dim);margin-top:1px}
.db-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 14px;border-top:1px solid var(--border);
  font-size:12px;
}
.db-val{font-size:16px;font-weight:bold;color:var(--gold)}

/* ── BACKSTORY ── */
.backstory-block{
  margin-bottom:14px;
  border:1px solid var(--border-g);
  border-radius:3px;
  background:linear-gradient(135deg,#100e08,#181208);
  padding:18px 20px;
  position:relative;
}
.backstory-block::before{
  content:'— 記録 —';
  position:absolute;top:-8px;left:20px;
  background:#0f0d08;padding:0 10px;
  font-size:9px;color:var(--gold);letter-spacing:.2em;opacity:.7;
}
.backstory-text{
  color:var(--parchment);font-size:13px;line-height:1.9;
  letter-spacing:.03em;
}

/* ── SKILLS ── */
.skills-block{margin-bottom:14px}
.skill-cat-label{
  font-size:9px;letter-spacing:.25em;color:var(--gold);
  text-transform:uppercase;opacity:.6;
  grid-column:1/-1;
  padding:10px 0 4px;
  border-bottom:1px solid var(--border);
  margin-bottom:4px;
}
.skills-all{
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px 20px;
  padding:14px;
}
@media(max-width:600px){.skills-all{grid-template-columns:repeat(2,1fr)}}
.sk-row{
  display:flex;align-items:center;gap:6px;
  padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03);
}
.sk-name{flex:1;font-size:11px;color:var(--text-dim)}
.sk-row.primary .sk-name{color:var(--gold2);font-weight:bold}
.sk-bar{width:60px;height:4px;background:var(--stone-d);border-radius:2px;overflow:hidden;flex-shrink:0}
.sk-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--moss),var(--moss2))}
.sk-fill.hi{background:linear-gradient(90deg,#885010,#c07820)}
.sk-fill.ex{background:linear-gradient(90deg,#802010,#c03020)}
.sk-val{width:26px;text-align:right;font-size:11px;color:var(--text);flex-shrink:0}
.sk-row.primary .sk-val{color:var(--gold)}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;right:24px;
  background:var(--moss);
  border:1px solid var(--moss2);
  border-radius:4px;color:#c8f0a0;
  padding:10px 20px;font-size:13px;
  opacity:0;transform:translateY(12px);
  transition:all .3s;pointer-events:none;z-index:999;
  font-family:inherit;
}
.toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>

<header class="gate">
  <div class="gate-rune">✦ ✦ ✦</div>
  <h1>深　淵　の　書</h1>
  <div class="gate-sub">Cthulhu Mythos TRPG &nbsp;·&nbsp; 6th Edition &nbsp;·&nbsp; Character Creator</div>
  <div class="gate-line">遺跡に刻まれし記録、汝の名を以てここに記せ</div>
</header>

<div class="controls">
  <div class="ctrl-group">
    <span class="ctrl-label">性別</span>
    <select id="sel-sex">
      <option value="random">ランダム</option>
      <option value="男性">男性</option>
      <option value="女性">女性</option>
    </select>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">職業</span>
    <select id="sel-job"></select>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">年齢</span>
    <input type="number" id="inp-age" min="14" max="80" placeholder="乱">
  </div>
  <button class="btn-gen" id="btn-gen">⚅ &nbsp;キャラクターを召喚する</button>
  <div class="spacer"></div>
  <div class="ctrl-group">
    <button class="btn-sm" id="btn-text">📜 テキスト</button>
    <button class="btn-coco" id="btn-coco">🎲 ココフォリア駒データ</button>
  </div>
</div>

<div class="content">
  <div class="empty-state" id="empty">
    <div class="empty-glyph">🌿</div>
    <p>遺跡の扉は、まだ閉じている</p>
    <small>「キャラクターを召喚する」を押して封印を解け</small>
  </div>
  <div id="sheet" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// =====================
// DATA
// =====================
const LN=['田中','鈴木','佐藤','山田','中村','小林','加藤','吉田','山口','松本','井上','木村','林','清水','山崎','阿部','池田','橋本','山本','岡田','渡辺','斎藤','高橋','伊藤','中島','福田','藤原','近藤','石川','宮崎','菊地','西村','上田','丸山','長谷川','野口','森','三浦','工藤','村田'];

const CATS=[
  {label:'探索',keys:['目星','聞き耳','隠れる','忍び歩き','追跡','ナビゲート','写真術']},
  {label:'交渉',keys:['言いくるめ','説得','信用','心理学','値切り']},
  {label:'知識',keys:['図書館','医学','応急手当','法律','会計','歴史','考古学','オカルト','クトゥルフ神話','天文学','生物学','地質学','薬学','化学','物理学','電子工学','機械修理','電気修理','コンピューター']},
  {label:'技芸',keys:['変装','芸術','製作']},

  {label:'戦闘',keys:['回避','こぶし','キック','頭突き','組み付き','拳銃','ライフル','ショットガン','サブマシンガン','刃物']},
  {label:'言語',keys:['母国語','他の言語']},
];

const OCC=[
  {name:'探偵',   pts:s=>s.EDU*20, cr:[20,45], skills:['図書館','言いくるめ','目星','心理学','法律','追跡','隠れる','聞き耳']},
  {name:'医師',   pts:s=>s.EDU*20, cr:[30,70], skills:['医学','生物学','薬学','応急手当','心理学','言いくるめ','信用','図書館']},
  {name:'警察官', pts:s=>s.EDU*20, cr:[20,40], skills:['法律','拳銃','こぶし','聞き耳','目星','追跡','隠れる','運転']},
  {name:'記者',   pts:s=>s.EDU*20, cr:[10,40], skills:['言いくるめ','図書館','目星','写真術','心理学','説得','歴史','運転']},
  {name:'学者・教授',pts:s=>s.EDU*20,cr:[20,70],skills:['図書館','歴史','考古学','心理学','信用','他の言語','オカルト','天文学']},
  {name:'軍人',   pts:s=>s.EDU*20, cr:[10,30], skills:['ライフル','こぶし','跳躍','登攀','隠れる','忍び歩き','応急手当','ナビゲート']},
  {name:'神父・牧師',pts:s=>s.EDU*20,cr:[20,50],skills:['心理学','言いくるめ','歴史','オカルト','図書館','聞き耳','信用','他の言語']},

  {name:'作家',   pts:s=>s.EDU*20, cr:[10,40], skills:['図書館','歴史','オカルト','心理学','写真術','言いくるめ','説得','他の言語']},

  {name:'冒険家', pts:s=>s.EDU*10+Math.max(s.DEX,s.STR)*10, cr:[10,40], skills:['登攀','水泳','跳躍','ナビゲート','応急手当','ライフル','運転','図書館']},

  {name:'占い師', pts:s=>s.EDU*20, cr:[10,40], skills:['オカルト','心理学','言いくるめ','歴史','図書館','説得','目星','聞き耳']},
  {name:'船員',   pts:s=>s.EDU*20, cr:[10,30], skills:['水泳','ナビゲート','投擲','ショットガン','機械修理','応急手当','聞き耳','登攀']},
  {name:'ディレッタント',pts:s=>s.EDU*20,cr:[50,99],skills:['芸術','乗馬','図書館','他の言語','ライフル','信用','説得','会計']},

// =====================
const STORY={
  birth:['東京の下町','大阪の古い商家','横浜の港のそば','神戸の異人館街の近く','京都の古い町家','長崎の坂の上','函館の霧深い港町','仙台の武家屋敷跡','北海道の開拓地','四国の山間の村','九州の炭鉱町','奥羽の雪深い農村','信州の山村','瀬戸内の島'],
  origin:[

  ],
  path:{

function makeStory(c){
  const p=a=>a[Math.floor(Math.random()*a.length)];
  const birth=p(STORY.birth);
  const origin=p(STORY.origin);
  const path=p(STORY.path[c.occupation]||STORY.defaultPath);
  const end=p(STORY.end);
  const agePfx=c.age<25?`まだ${c.age}歳と若いが、`:c.age>55?`${c.age}歳となった今も、`:`${c.age}歳の`;
  return `${birth}に生まれ、${origin} ${path} ${agePfx}その歩みが、新たな局面を迎えようとしている。${end}`;
}

// =====================
// UTILS
// =====================
const d6=()=>Math.floor(Math.random()*6)+1;
const r3d6=()=>d6()+d6()+d6();
const r2d6p6=()=>d6()+d6()+6;
const r3d6p3=()=>Math.min(d6()+d6()+d6()+3,18);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

function db(str,siz){
  const t=str+siz;
  if(t<=12)return'-1d6';
  if(t<=16)return'-1d4';
  if(t<=24)return'0';
  if(t<=32)return'+1d4';
  if(t<=40)return'+1d6';
  return'+2d6';
}

function distrib(names,total,cur){
  const r={};names.forEach(n=>r[n]=cur[n]??BASE[n]??1);
  if(!names.length||total<=0)return r;
  const w=names.map(()=>Math.random()*.8+.2);
  const ws=w.reduce((a,b)=>a+b,0);
  const al=w.map(x=>Math.round(total*x/ws));
  const as=al.reduce((a,b)=>a+b,0);
  al[al.length-1]+=total-as;
  let left=0;
  names.forEach((n,i)=>{
    const base=r[n],room=Math.max(0,90-base);
    const add=clamp(al[i]+left,0,room);
    left=al[i]+left-add;
    r[n]=base+add;
  });
  if(left>0){
    for(const n of [...names].sort(()=>Math.random()-.5)){
      if(left<=0)break;
      const room=90-r[n];
      if(room>0){const add=Math.min(room,left);r[n]+=add;left-=add;}
    }
  }
  return r;
}

// =====================
// GENERATE
// =====================
let CHAR=null;

function generate(){
  const sexV=document.getElementById('sel-sex').value;
  const jobV=document.getElementById('sel-job').value;
  const ageV=document.getElementById('inp-age').value;

  const sex=sexV==='random'?pick(['男性','女性']):sexV;
  const name=pick(LN)+' '+pick(sex==='男性'?FM:FF);
  const age=ageV?parseInt(ageV):Math.floor(Math.random()*48)+18;

  const stats={STR:r3d6(),CON:r3d6(),POW:r3d6(),DEX:r3d6(),APP:r3d6(),SIZ:r2d6p6(),INT:r2d6p6(),EDU:r3d6p3()};
  const {STR,CON,POW,DEX,APP,SIZ,INT,EDU}=stats;

  const HP=Math.floor((CON+SIZ)/2);
  const MP=POW;
  const SAN=POW*5;
  const Luck=POW*5;
  const Idea=INT*5;
  const Know=EDU*5;
  const DB=db(STR,SIZ);

  const occ=jobV==='random'?pick(OCC):OCC.find(o=>o.name===jobV)||pick(OCC);

  let sk={...BASE};
  sk['回避']=DEX*2;
  sk['母国語']=EDU*5;

  const occPts=occ.pts(stats);
  Object.assign(sk,distrib(occ.skills,occPts,sk));
  sk['信用']=Math.floor(Math.random()*(occ.cr[1]-occ.cr[0])+occ.cr[0]);

  const hobbyPool=Object.keys(sk).filter(k=>!occ.skills.includes(k)&&k!=='クトゥルフ神話'&&k!=='母国語'&&k!=='信用');
  const hobbyPick=[...hobbyPool].sort(()=>Math.random()-.5).slice(0,6);
  Object.assign(sk,distrib(hobbyPick,INT*10,sk));

  CHAR={name,sex,age,occupation:occ.name,primarySkills:occ.skills,
        stats,skills:sk,derived:{HP,MP,SAN,Luck,Idea,Know,DB},
        occPts,hobbyPts:INT*10,story:null};
  CHAR.story=makeStory(CHAR);
  return CHAR;
}

// =====================
// RENDER
// =====================
function render(c){
  const {stats:s,derived:d,skills:sk,primarySkills:ps}=c;
  const sh=document.getElementById('sheet');

  const dBox=(cls,label,val)=>`<div class="d-box ${cls}"><div class="dl">${label}</div><div class="dv">${val}</div></div>`;

  const statBox=(k,v)=>`<div class="stat-box"><div class="sn">${k}</div><div class="sv">${v}</div><div class="sx">×5&nbsp;=&nbsp;${v*5}</div></div>`;

  const skRow=(k,v)=>{
    const pct=Math.min(v,90);
    const cls=v>=80?'ex':v>=60?'hi':'';
    const prim=ps.includes(k)?'primary':'';
    return `<div class="sk-row ${prim}">
      <span class="sk-name">${k}</span>
      <div class="sk-bar"><div class="sk-fill ${cls}" style="width:${pct}%"></div></div>
      <span class="sk-val">${v}</span>
    </div>`;
  };

  const allSkRows=CATS.map(cat=>{
    const rows=cat.keys.filter(k=>k in sk).map(k=>skRow(k,sk[k])).join('');
    return`<div class="skill-cat-label">${cat.label}</div>${rows}`;
  }).join('');

  sh.innerHTML=`
<div class="char-header">
  <div class="char-name">${c.name}</div>
  <div class="char-meta">
    <span class="meta-tag">${c.sex}</span>
    <span class="meta-tag">·</span>
    <span class="meta-tag">${c.age}歳</span>
    <span class="meta-tag">·</span>
    <span class="occ-badge">${c.occupation}</span>
  </div>
  <div class="derived-row">
    ${dBox('hp','HP',d.HP)}
    ${dBox('mp','MP',d.MP)}
    ${dBox('san','SAN',d.SAN)}
    ${dBox('','幸運',d.Luck)}
    ${dBox('','アイデア',d.Idea)}
    ${dBox('','知識',d.Know)}
  </div>
</div>

<div class="grid2">
  <div class="slab">
    <div class="slab-title">能力値</div>
    <div class="stat-grid">
      ${['STR','CON','POW','DEX','APP','SIZ','INT','EDU'].map(k=>statBox(k,s[k])).join('')}
    </div>
    <div class="db-row"><span>ダメージボーナス</span><span class="db-val">${d.DB}</span></div>
  </div>

  <div class="slab">
    <div class="slab-title">職業技能（太字）&emsp;職業P:${c.occPts} 趣味P:${c.hobbyPts}</div>
    <div class="skills-all" style="grid-template-columns:1fr">
      ${ps.filter(k=>k in sk).map(k=>skRow(k,sk[k])).join('')}
    </div>
  </div>
</div>

<div class="backstory-block">
  <p class="backstory-text">${c.story}</p>
</div>

<div class="slab skills-block">
  <div class="slab-title">全技能</div>
  <div class="skills-all">${allSkRows}</div>
</div>
`;

  document.getElementById('empty').style.display='none';
  sh.style.display='block';
}

function toText(c){
  const {stats:s,derived:d,skills:sk,primarySkills:ps}=c;
  return[
    '=== クトゥルフ神話TRPG 6版 キャラクターシート ===',
    `名前: ${c.name}　性別: ${c.sex}　年齢: ${c.age}歳　職業: ${c.occupation}`,
    '',
    `STR:${s.STR}  CON:${s.CON}  POW:${s.POW}  DEX:${s.DEX}`,
    `APP:${s.APP}  SIZ:${s.SIZ}  INT:${s.INT}  EDU:${s.EDU}`,
    `HP:${d.HP}  MP:${d.MP}  SAN:${d.SAN}  幸運:${d.Luck}  アイデア:${d.Idea}  知識:${d.Know}`,
    `DB:${d.DB}`,
    '',
    '--- 技能（＊職業技能）---',
    ...CATS.map(cat=>{
      const rows=cat.keys.filter(k=>k in sk&&(sk[k]>(BASE[k]??0)+5||ps.includes(k)));
      if(!rows.length)return null;
      return[`[${cat.label}]`,...rows.map(k=>`  ${ps.includes(k)?'＊':'　'}${k}: ${sk[k]}`)].join('\n');
    }).filter(Boolean),
    '',
    '--- 背景設定 ---',
    c.story,
  ].join('\n');
}

function toCoco(c){
  const {stats:s,derived:d,skills:sk}=c;

  const skillCmds=Object.entries(sk)
    .filter(([k,v])=>v>0&&k!=='クトゥルフ神話'&&k!=='母国語')
    .sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>`CCB<=${v} 【${k}】`)
    .join('\n');

  const cmds=[
    `1d100<={SAN} 【正気度ロール】`,
    `CCB<=${d.Idea} 【アイデア】`,
    `CCB<=${d.Luck} 【幸運】`,
    `CCB<=${d.Know} 【知識】`,
    skillCmds,
    `CCB<={STR}*5 【STR×5】`,
    `CCB<={CON}*5 【CON×5】`,
    `CCB<={POW}*5 【POW×5】`,
    `CCB<={DEX}*5 【DEX×5】`,
    `CCB<={APP}*5 【APP×5】`,
    `CCB<={SIZ}*5 【SIZ×5】`,
    `CCB<={INT}*5 【INT×5】`,
    `CCB<={EDU}*5 【EDU×5】`,
  ].join('\n');

  return JSON.stringify({
    kind:'character',
    data:{
      name:c.name,
      initiative:s.DEX,
      externalUrl:'',
      iconUrl:'',
      size:3,
      width:3,
      height:3,
      commands:cmds,
      status:[
        {label:'HP', value:d.HP, max:d.HP},
        {label:'MP', value:d.MP, max:d.MP},
        {label:'SAN',value:d.SAN,max:d.SAN},
      ],
      params:[
        {label:'STR',value:String(s.STR)},
        {label:'CON',value:String(s.CON)},
        {label:'POW',value:String(s.POW)},
        {label:'DEX',value:String(s.DEX)},
        {label:'APP',value:String(s.APP)},
        {label:'SIZ',value:String(s.SIZ)},
        {label:'INT',value:String(s.INT)},
        {label:'EDU',value:String(s.EDU)},
      ],
    }
  });
}

function copy(text,msg){
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast(msg));
  }else{
    const ta=document.createElement('textarea');
    ta.value=text;ta.style.cssText='position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand('copy');toast(msg);}
    catch{toast('コピー失敗。手動でコピーしてください');}
    document.body.removeChild(ta);
  }
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

// =====================
// INIT
// =====================
function init(){
  const sel=document.getElementById('sel-job');
  const opt=document.createElement('option');
  opt.value='random';opt.textContent='ランダム';sel.appendChild(opt);
  OCC.forEach(o=>{
    const el=document.createElement('option');
    el.value=o.name;el.textContent=o.name;sel.appendChild(el);
  });

  document.getElementById('btn-gen').addEventListener('click',()=>{
    const c=generate();render(c);
  });
  document.getElementById('btn-text').addEventListener('click',()=>{
    if(!CHAR){toast('先にキャラクターを生成してください');return;}
    copy(toText(CHAR),'テキストをコピーしました');
  });
  document.getElementById('btn-coco').addEventListener('click',()=>{
    if(!CHAR){toast('先にキャラクターを生成してください');return;}
    copy(toCoco(CHAR),'ココフォリア駒データをコピーしました');
  });
}

document.addEventListener('DOMContentLoaded',init);
