<html lang="ja">
<head>
<meta charset="UTF-8">

<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f3f4f7;
  --text:#15181d; --text-dim:#646b76; --text-faint:#a0a6b0;
  --border:#ebedf1; --border-2:#dde0e6;
  --accent:#4338ca; --accent-h:#372fb0; --accent-soft:#eef0ff;
  --ok:#1f9d6b; --hp:#d65450; --mp:#3b6fe0; --san:#7c5cd6;
  --radius:14px;
  --shadow-sm:0 1px 2px rgba(20,24,33,.05);
  --shadow:0 1px 2px rgba(20,24,33,.04), 0 6px 18px -6px rgba(20,24,33,.10);
  --shadow-lg:0 12px 32px -10px rgba(20,24,33,.22);
  --body-hi:#ffffff;
  --toast-bg:#15181d; --toast-fg:#ffffff;
  --btn-glow:0 1px 2px rgba(67,56,202,.25), 0 6px 16px -8px rgba(67,56,202,.5);
  --btn-glow-h:0 2px 4px rgba(67,56,202,.28), 0 12px 22px -10px rgba(67,56,202,.6);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1013; --surface:#171a1f; --surface-2:#20242d;
    --text:#e7e9ee; --text-dim:#9aa1ad; --text-faint:#5f6674;
    --border:#252a33; --border-2:#333a45;
    --accent:#8b83ff; --accent-h:#9d96ff; --accent-soft:rgba(139,131,255,.16);
    --ok:#37c78f; --hp:#e87571; --mp:#5f8dff; --san:#a48bff;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px -8px rgba(0,0,0,.55);
    --shadow-lg:0 14px 36px -10px rgba(0,0,0,.7);
    --body-hi:rgba(139,131,255,.06);
    --toast-bg:#272c36; --toast-fg:#f2f4f8;
    --btn-glow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px -8px rgba(139,131,255,.5);
    --btn-glow-h:0 2px 6px rgba(0,0,0,.45), 0 12px 24px -10px rgba(139,131,255,.65);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 480px at 50% -10%, var(--body-hi) 0%, rgba(255,255,255,0) 70%),
    var(--bg);
  color:var(--text);
  font-family:'Inter','Segoe UI','Hiragino Sans','Yu Gothic UI','Noto Sans JP',system-ui,sans-serif;
  font-size:14px; line-height:1.6; min-height:100vh;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-feature-settings:"palt" 1;
}

/* head */
.head{padding:40px 24px 8px}
.head-in{max-width:880px;margin:0 auto}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.head h1{font-size:27px;font-weight:700;letter-spacing:-.02em;color:var(--text);line-height:1.2}
.head-sub{font-size:14px;color:var(--text-dim);margin-top:8px;max-width:620px}
.wrap{max-width:880px;margin:0 auto;padding:24px}

/* input */
.input-block{margin-bottom:26px}
.lbl{font-size:13px;font-weight:600;color:var(--text);margin-bottom:9px;display:block}
.fields{display:flex;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--text-dim);font-weight:500}
select,input[type=number]{
  background:var(--surface); border:1px solid var(--border-2); border-radius:9px;
  color:var(--text); padding:9px 12px; font-size:13px; font-family:inherit;
  outline:none; cursor:pointer; box-shadow:var(--shadow-sm);
  transition:border-color .18s, box-shadow .18s;
}
select{min-width:132px}
input[type=number]{width:132px;cursor:text;font-variant-numeric:tabular-nums}
select:hover,input[type=number]:hover{border-color:var(--text-faint)}
select:focus,input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
input::placeholder{color:var(--text-faint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.btn{
  background:var(--accent); border:1px solid var(--accent); border-radius:9px;
  color:#fff; font-size:14px; font-weight:600; font-family:inherit;
  padding:10px 22px; cursor:pointer; box-shadow:var(--btn-glow);
  transition:transform .15s, box-shadow .15s, background .15s;
}
.btn:hover{background:var(--accent-h);transform:translateY(-1px);box-shadow:var(--btn-glow-h)}
.btn:active{transform:translateY(0)}
.btn-sm{
  background:var(--surface); border:1px solid var(--border-2); border-radius:9px; color:var(--text-dim);
  font-size:13px; font-family:inherit; font-weight:500; padding:9px 16px; cursor:pointer;
  box-shadow:var(--shadow-sm); transition:all .15s;
}
.btn-sm:hover{border-color:var(--text-dim);color:var(--text);transform:translateY(-1px)}
.btn:focus-visible,.btn-sm:focus-visible{outline:none;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.hint{font-size:12px;color:var(--text-dim);margin-top:12px;line-height:1.75}

/* card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden}
.card-t{display:flex;align-items:baseline;gap:10px;font-size:15px;font-weight:600;color:var(--text);padding:18px 22px 16px}
.card-t .sub{font-weight:400;color:var(--text-faint);font-size:12px;letter-spacing:.01em}
.card-body{padding:4px 22px 22px}
.empty{color:var(--text-faint);text-align:center;padding:44px 20px;font-size:13px}

/* character */
.char-name{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.char-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pill{
  font-size:12px;color:var(--text-dim);background:var(--surface-2);
  border:1px solid var(--border-2);border-radius:999px;padding:3px 12px;
}
.pill.occ{color:var(--accent);background:var(--accent-soft);border-color:transparent;font-weight:600}

/* derived */
.derived-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:18px}
.d-box{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:11px 8px;text-align:center}
.d-box .dl{font-size:10px;letter-spacing:.08em;color:var(--text-faint);font-weight:600;text-transform:uppercase}
.d-box .dv{font-size:23px;font-weight:700;margin-top:2px;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--text)}
.d-box.hp .dv{color:var(--hp)}
.d-box.mp .dv{color:var(--mp)}
.d-box.san .dv{color:var(--san)}
@media(max-width:600px){.derived-row{grid-template-columns:repeat(3,1fr)}}

/* grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid2 .card{margin-bottom:20px}
@media(max-width:720px){.grid2{grid-template-columns:1fr;gap:0}}

/* stats */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat-box{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;text-align:center;padding:9px 4px}
.stat-box .sn{font-size:10px;letter-spacing:.08em;color:var(--text-faint);font-weight:600}
.stat-box .sv{font-size:22px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat-box .sx{font-size:10px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.db-row{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:14px;padding-top:13px;border-top:1px solid var(--border);
  font-size:13px;color:var(--text-dim);
}
.db-val{font-size:15px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}

/* story */
.story{
  font-size:14px;line-height:2;color:var(--text-dim);
  border-left:3px solid var(--accent);border-radius:2px;
  padding-left:16px;
}

/* skills */
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 22px}
.skills.one{grid-template-columns:1fr}
@media(max-width:640px){.skills{grid-template-columns:repeat(2,1fr)}}
.sk-cat{
  grid-column:1/-1;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-faint);padding:14px 0 6px;border-bottom:1px solid var(--border-2);margin-bottom:4px;
}
.sk-cat:first-child{padding-top:2px}
.sk-row{display:flex;align-items:center;gap:9px;padding:4px 0;border-bottom:1px solid var(--border)}
.sk-name{flex:1;font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-row.primary .sk-name{color:var(--text);font-weight:600}
.sk-bar{width:56px;height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;flex-shrink:0}
.sk-fill{height:100%;border-radius:4px;background:var(--border-2)}
.sk-row.primary .sk-fill{background:var(--accent)}
.sk-val{width:26px;text-align:right;font-size:12.5px;color:var(--text-dim);flex-shrink:0;font-variant-numeric:tabular-nums}
.sk-row.primary .sk-val{color:var(--text);font-weight:600}

/* toast */
.toast{position:fixed;bottom:26px;right:26px;background:var(--toast-bg);
  border-radius:11px;color:var(--toast-fg);padding:12px 20px;font-size:13px;font-weight:500;opacity:0;transform:translateY(12px);
  transition:all .28s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:99;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateY(0)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
  .btn:hover,.btn-sm:hover{transform:none}
}
@media(max-width:600px){
  .head{padding:28px 18px 4px}
  .head h1{font-size:23px}
  .wrap{padding:18px}
  .card-t,.card-body{padding-left:16px;padding-right:16px}
  .char-name{font-size:22px}
  select,input[type=number]{min-width:0;width:100%}
  .field{flex:1;min-width:104px}
}
</style>
</head>
<body>

<header class="head">
  <div class="head-in">
    <div class="eyebrow">CoC 6th Edition · Character Creator</div>
    <h1>キャラシメーカー</h1>
    <div class="head-sub">ボタンひとつで、クトゥルフ神話TRPG6版の探索者を1人ぶん作ります。能力値・職業技能・背景設定に加えて、ココフォリアの駒データもそのまま持ち出せます。</div>
  </div>
</header>

<div class="wrap">
  <div class="input-block">
    <span class="lbl">条件</span>
    <div class="fields">
      <div class="field">
        <label for="sel-sex">性別</label>
        <select id="sel-sex">
          <option value="random">ランダム</option>
          <option value="男性">男性</option>
          <option value="女性">女性</option>
        </select>
      </div>
      <div class="field">
        <label for="sel-job">職業</label>
        <select id="sel-job"></select>
      </div>
      <div class="field">
        <label for="inp-age">年齢</label>
        <input type="number" id="inp-age" min="14" max="80" placeholder="ランダム">
      </div>
    </div>
    <div class="row">
      <button class="btn" id="btn-gen">探索者を生成する</button>
      <button class="btn-sm" id="btn-text">テキストをコピー</button>
      <button class="btn-sm" id="btn-coco">ココフォリアの駒をコピー</button>
    </div>
    <div class="hint">年齢は空欄でランダム。6版のルールに合わせて最低年齢は EDU+6 とし、年齢を指定した場合は EDU 側を調整します。ココフォリアの駒データは、コピーしてルーム上で Ctrl+V を押すだけで駒になります。</div>
  </div>

  <div class="card" id="empty">
    <div class="empty">「探索者を生成する」を押すと、ここにキャラクターシートが出ます。</div>
  </div>
  <div id="sheet" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// =====================
// DATA
// =====================
const LN=['田中','鈴木','佐藤','山田','中村','小林','加藤','吉田','山口','松本','井上','木村','林','清水','山崎','阿部','池田','橋本','山本','岡田','渡辺','斎藤','高橋','伊藤','中島','福田','藤原','近藤','石川','宮崎','菊地','西村','上田','丸山','長谷川','野口','森','三浦','工藤','村田'];
const FM=['太郎','健','翔','大輔','誠','浩','直樹','拓也','雄介','晴彦','剛','博','慎一','光','勇','哲也','進','隆','和也','俊介','廉','大樹','悠','亮','裕二'];
const FF=['花子','恵','由美','裕子','幸','明子','真由美','愛','美咲','奈々','麻衣','千尋','彩','陽菜','美樹','優子','沙織','香','遥','凛','澪','七海','紗英','里奈','詩織'];

const BASE={
  '目星':25,'聞き耳':25,'隠れる':10,'忍び歩き':10,'追跡':10,'ナビゲート':10,'写真術':10,
  '言いくるめ':5,'説得':15,'信用':15,'心理学':5,'値切り':5,
  '図書館':25,'医学':5,'応急手当':30,'法律':5,'会計':10,'歴史':20,'考古学':1,'オカルト':5,'クトゥルフ神話':0,
  '天文学':1,'生物学':1,'地質学':1,'薬学':1,'化学':1,'物理学':1,'電子工学':1,'機械修理':20,'電気修理':10,'コンピューター':1,
  '変装':1,'芸術':5,'製作':5,
  '登攀':40,'跳躍':25,'水泳':25,'投擲':25,'運転':20,'乗馬':5,
  'こぶし':50,'キック':25,'頭突き':10,'組み付き':25,
  '拳銃':20,'ライフル':25,'ショットガン':30,'サブマシンガン':15,'刃物':25,
  '回避':0,'母国語':0,'他の言語':1,
};

const CATS=[
  {label:'探索',keys:['目星','聞き耳','隠れる','忍び歩き','追跡','ナビゲート','写真術']},
  {label:'交渉',keys:['言いくるめ','説得','信用','心理学','値切り']},
  {label:'知識',keys:['図書館','医学','応急手当','法律','会計','歴史','考古学','オカルト','クトゥルフ神話','天文学','生物学','地質学','薬学','化学','物理学','電子工学','機械修理','電気修理','コンピューター']},
  {label:'技芸',keys:['変装','芸術','製作']},
  {label:'行動',keys:['登攀','跳躍','水泳','投擲','運転','乗馬']},
  {label:'戦闘',keys:['回避','こぶし','キック','頭突き','組み付き','拳銃','ライフル','ショットガン','サブマシンガン','刃物']},
  {label:'言語',keys:['母国語','他の言語']},
];

const OCC=[
  {name:'探偵',   pts:s=>s.EDU*20, cr:[20,45], skills:['図書館','言いくるめ','目星','心理学','法律','追跡','隠れる','聞き耳']},
  {name:'医師',   pts:s=>s.EDU*20, cr:[30,70], skills:['医学','生物学','薬学','応急手当','心理学','言いくるめ','信用','図書館']},
  {name:'警察官', pts:s=>s.EDU*20, cr:[20,40], skills:['法律','拳銃','こぶし','聞き耳','目星','追跡','隠れる','運転']},
  {name:'記者',   pts:s=>s.EDU*20, cr:[10,40], skills:['言いくるめ','図書館','目星','写真術','心理学','説得','歴史','運転']},
  {name:'学者・教授',pts:s=>s.EDU*20,cr:[20,70],skills:['図書館','歴史','考古学','心理学','信用','他の言語','オカルト','天文学']},
  {name:'軍人',   pts:s=>s.EDU*20, cr:[10,30], skills:['ライフル','こぶし','跳躍','登攀','隠れる','忍び歩き','応急手当','ナビゲート']},
  {name:'神父・牧師',pts:s=>s.EDU*20,cr:[20,50],skills:['心理学','言いくるめ','歴史','オカルト','図書館','聞き耳','信用','他の言語']},
  {name:'芸術家', pts:s=>s.EDU*10+Math.max(s.DEX,s.APP)*10, cr:[5,30], skills:['芸術','心理学','聞き耳','目星','言いくるめ','説得','写真術','製作']},
  {name:'作家',   pts:s=>s.EDU*20, cr:[10,40], skills:['図書館','歴史','オカルト','心理学','写真術','言いくるめ','説得','他の言語']},
  {name:'古物商', pts:s=>s.EDU*20, cr:[20,50], skills:['図書館','歴史','考古学','言いくるめ','値切り','信用','他の言語','芸術']},
  {name:'冒険家', pts:s=>s.EDU*10+Math.max(s.DEX,s.STR)*10, cr:[10,40], skills:['登攀','水泳','跳躍','ナビゲート','応急手当','ライフル','運転','図書館']},
  {name:'刑事',   pts:s=>s.EDU*20, cr:[20,50], skills:['法律','目星','聞き耳','心理学','追跡','こぶし','拳銃','言いくるめ']},
  {name:'精神科医',pts:s=>s.EDU*20,cr:[30,70], skills:['心理学','医学','薬学','言いくるめ','説得','図書館','信用','聞き耳']},
  {name:'建築家', pts:s=>s.EDU*20, cr:[30,60], skills:['製作','機械修理','電気修理','図書館','物理学','会計','信用','歴史']},
  {name:'占い師', pts:s=>s.EDU*20, cr:[10,40], skills:['オカルト','心理学','言いくるめ','歴史','図書館','説得','目星','聞き耳']},
  {name:'船員',   pts:s=>s.EDU*20, cr:[10,30], skills:['水泳','ナビゲート','投擲','ショットガン','機械修理','応急手当','聞き耳','登攀']},
  {name:'ディレッタント',pts:s=>s.EDU*20,cr:[50,99],skills:['芸術','乗馬','図書館','他の言語','ライフル','信用','説得','会計']},
];

// =====================
// STORY DATA
// =====================
const STORY={
  birth:['東京の下町','大阪の古い商家','横浜の港のそば','神戸の異人館街の近く','京都の古い町家','長崎の坂の上','函館の霧深い港町','仙台の武家屋敷跡','北海道の開拓地','四国の山間の村','九州の炭鉱町','奥羽の雪深い農村','信州の山村','瀬戸内の島','金沢の茶屋街の裏','広島の城下町','東京の山の手','名古屋の商家の並ぶ町','奈良の門前町','新潟の湊町','鎌倉の谷戸の奥','小樽の運河のほとり','会津の城下町','紀伊の漁村'],
  origin:[
    '旧家の子だったが、父の事業の失敗により家は没落した。',
    '学者であった父の書斎で育ち、怪しい書物を読み漁って少年期を過ごした。',
    '幼くして両親を病で失い、親戚の家を転々としながら育った。',
    '裕福な商家の子として何不自由なく育ったが、ある出来事を境に世界観が変わった。',
    '神職の家系に育ち、死や祭祀を幼い頃から身近に感じてきた。',
    '軍人の家系に育ち、規律と義務を骨の髄まで叩き込まれた。',

function makeStory(c){
  const p=a=>a[Math.floor(Math.random()*a.length)];
  const birth=p(STORY.birth);
  const origin=p(STORY.origin);
  const path=p(STORY.path[c.occupation]||STORY.defaultPath);
  const end=p(STORY.end);
  const agePfx=c.age<25?`まだ${c.age}歳と若いが、`:c.age>55?`${c.age}歳となった今も、`:`${c.age}歳になった。`;
  return `${birth}に生まれ、${origin}${path}${agePfx}その歩みが、新たな局面を迎えようとしている。${end}`;
}

const d6=()=>Math.floor(Math.random()*6)+1;
const r3d6=()=>d6()+d6()+d6();
const r2d6p6=()=>d6()+d6()+6;
const r3d6p3=()=>Math.min(d6()+d6()+d6()+3,18);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

function db(str,siz){
  const t=str+siz;
  if(t<=12)return'-1d6';
  if(t<=16)return'-1d4';
  if(t<=24)return'0';
  if(t<=32)return'+1d4';
  if(t<=40)return'+1d6';
  return'+2d6';
}

function distrib(names,total,cur){
  const r={};names.forEach(n=>r[n]=cur[n]??BASE[n]??1);
  if(!names.length||total<=0)return r;
  const w=names.map(()=>Math.random()*.8+.2);
  const ws=w.reduce((a,b)=>a+b,0);
  const al=w.map(x=>Math.round(total*x/ws));
  const as=al.reduce((a,b)=>a+b,0);
  al[al.length-1]+=total-as;
  let left=0;
  names.forEach((n,i)=>{
    const base=r[n],room=Math.max(0,90-base);
    const add=clamp(al[i]+left,0,room);
    left=al[i]+left-add;
    r[n]=base+add;
  });
  if(left>0){
    for(const n of [...names].sort(()=>Math.random()-.5)){
      if(left<=0)break;
      const room=90-r[n];
      if(room>0){const add=Math.min(room,left);r[n]+=add;left-=add;}
    }
  }
  return r;
}

let CHAR=null;

function generate(){
  const sexV=document.getElementById('sel-sex').value;
  const jobV=document.getElementById('sel-job').value;
  const ageV=document.getElementById('inp-age').value;

  const sex=sexV==='random'?pick(['男性','女性']):sexV;
  const name=pick(LN)+' '+pick(sex==='男性'?FM:FF);

  const stats={STR:r3d6(),CON:r3d6(),POW:r3d6(),DEX:r3d6(),APP:r3d6(),SIZ:r2d6p6(),INT:r2d6p6(),EDU:r3d6p3()};

  // 6版ルール：探索者の最低年齢 = EDU + 6
  let age;
  if(ageV){
    age=clamp(parseInt(ageV),14,80);
    stats.EDU=Math.min(stats.EDU,age-6);
  }else{
    age=Math.max(stats.EDU+6,Math.floor(Math.random()*48)+18);
  }
  const {STR,CON,POW,DEX,APP,SIZ,INT,EDU}=stats;

  const HP=Math.floor((CON+SIZ)/2);
  const MP=POW;
  const SAN=POW*5;
  const Luck=POW*5;
  const Idea=INT*5;
  const Know=EDU*5;
  const DB=db(STR,SIZ);

  const occ=jobV==='random'?pick(OCC):OCC.find(o=>o.name===jobV)||pick(OCC);

  let sk={...BASE};
  sk['回避']=DEX*2;
  sk['母国語']=EDU*5;

  const occPts=occ.pts(stats);
  Object.assign(sk,distrib(occ.skills,occPts,sk));
  sk['信用']=Math.floor(Math.random()*(occ.cr[1]-occ.cr[0])+occ.cr[0]);

  const hobbyPool=Object.keys(sk).filter(k=>!occ.skills.includes(k)&&k!=='クトゥルフ神話'&&k!=='母国語'&&k!=='信用');
  const hobbyPick=[...hobbyPool].sort(()=>Math.random()-.5).slice(0,6);
  Object.assign(sk,distrib(hobbyPick,INT*10,sk));

  CHAR={name,sex,age,occupation:occ.name,primarySkills:occ.skills,
        stats,skills:sk,derived:{HP,MP,SAN,Luck,Idea,Know,DB},
        occPts,hobbyPts:INT*10,story:null};
  CHAR.story=makeStory(CHAR);
  return CHAR;
}

  const skRow=(k,v)=>{
    const pct=Math.min(v,90);

    <div class="derived-row">
      ${dBox('hp','HP',d.HP)}
      ${dBox('mp','MP',d.MP)}
      ${dBox('san','SAN',d.SAN)}
      ${dBox('','幸運',d.Luck)}
      ${dBox('','アイデア',d.Idea)}
      ${dBox('','知識',d.Know)}
    </div>
  </div>
</div>

<div class="grid2">
  <div class="card">
    <div class="card-t">能力値<span class="sub">下段は ×5 の値</span></div>
    <div class="card-body">
      <div class="stat-grid">
        ${['STR','CON','POW','DEX','APP','SIZ','INT','EDU'].map(k=>statBox(k,s[k])).join('')}
      </div>
      <div class="db-row"><span>ダメージボーナス</span><span class="db-val">${d.DB}</span></div>
    </div>

  <div class="card">
    <div class="card-t">職業技能<span class="sub">職業P ${c.occPts} / 趣味P ${c.hobbyPts}</span></div>

function toText(c){
  const {stats:s,derived:d,skills:sk,primarySkills:ps}=c;
  return[
    '=== クトゥルフ神話TRPG 6版 キャラクターシート ===',
    `名前: ${c.name}　性別: ${c.sex}　年齢: ${c.age}歳　職業: ${c.occupation}`,
    '',
    `STR:${s.STR}  CON:${s.CON}  POW:${s.POW}  DEX:${s.DEX}`,
    `APP:${s.APP}  SIZ:${s.SIZ}  INT:${s.INT}  EDU:${s.EDU}`,
    `HP:${d.HP}  MP:${d.MP}  SAN:${d.SAN}  幸運:${d.Luck}  アイデア:${d.Idea}  知識:${d.Know}`,
    `DB:${d.DB}`,
    '',
    '--- 技能（＊職業技能）---',
    ...CATS.map(cat=>{
      const rows=cat.keys.filter(k=>k in sk&&(sk[k]>(BASE[k]??0)+5||ps.includes(k)));
      if(!rows.length)return null;
      return[`[${cat.label}]`,...rows.map(k=>`  ${ps.includes(k)?'＊':'　'}${k}: ${sk[k]}`)].join('\n');
    }).filter(Boolean),
    '',
    '--- 背景設定 ---',
    c.story,
  ].join('\n');
}

function toCoco(c){
  const {stats:s,derived:d,skills:sk}=c;

  const skillCmds=Object.entries(sk)
    .filter(([k,v])=>v>0&&k!=='クトゥルフ神話'&&k!=='母国語')
    .sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>`CCB<=${v} 【${k}】`)
    .join('\n');

  const dbSuf=d.DB==='0'?'+0':d.DB;
  const dmgCmds=[
    `1d3${dbSuf} 【ダメージ：こぶし】`,
    `1d6${dbSuf} 【ダメージ：キック】`,
    `1d4${dbSuf} 【ダメージ：頭突き】`,
    `1d4${dbSuf} 【ダメージ：刃物】`,
  ];
  if(sk['拳銃']>BASE['拳銃'])dmgCmds.push(`1d10 【ダメージ：拳銃】`);
  if(sk['ライフル']>BASE['ライフル'])dmgCmds.push(`2d6+4 【ダメージ：ライフル】`);
  if(sk['ショットガン']>BASE['ショットガン'])dmgCmds.push(`4d6 【ダメージ：ショットガン(至近)】`);
  if(sk['サブマシンガン']>BASE['サブマシンガン'])dmgCmds.push(`1d10+2 【ダメージ：サブマシンガン】`);

  const cmds=[
    `1d100<={SAN} 【正気度ロール】`,
    `CCB<=${d.Idea} 【アイデア】`,
    `CCB<=${d.Luck} 【幸運】`,
    `CCB<=${d.Know} 【知識】`,
    skillCmds,
    dmgCmds.join('\n'),
    `CCB<={STR}*5 【STR×5】`,
    `CCB<={CON}*5 【CON×5】`,
    `CCB<={POW}*5 【POW×5】`,
    `CCB<={DEX}*5 【DEX×5】`,
    `CCB<={APP}*5 【APP×5】`,
    `CCB<={SIZ}*5 【SIZ×5】`,
    `CCB<={INT}*5 【INT×5】`,
    `CCB<={EDU}*5 【EDU×5】`,
  ].join('\n');

  return JSON.stringify({
    kind:'character',
    data:{
      name:c.name,
      initiative:s.DEX,
      externalUrl:'',
      iconUrl:'',
      size:3,
      width:3,
      height:3,
      commands:cmds,
      status:[
        {label:'HP', value:d.HP, max:d.HP},
        {label:'MP', value:d.MP, max:d.MP},
        {label:'SAN',value:d.SAN,max:d.SAN},
      ],
      params:[
        {label:'STR',value:String(s.STR)},
        {label:'CON',value:String(s.CON)},
        {label:'POW',value:String(s.POW)},
        {label:'DEX',value:String(s.DEX)},
        {label:'APP',value:String(s.APP)},
        {label:'SIZ',value:String(s.SIZ)},
        {label:'INT',value:String(s.INT)},
        {label:'EDU',value:String(s.EDU)},
      ],
    }
  });
}

function copy(text,msg){
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(()=>fallbackCopy(text,msg));
  }else{
    fallbackCopy(text,msg);
  }
}

function fallbackCopy(text,msg){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.cssText='position:fixed;opacity:0;pointer-events:none';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');toast(msg);}
  catch{toast('コピー失敗。手動でコピーしてください');}
  document.body.removeChild(ta);
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

  const sel=document.getElementById('sel-job');

    el.value=o.name;el.textContent=o.name;sel.appendChild(el);
  });

  document.getElementById('btn-gen').addEventListener('click',()=>{
    const c=generate();render(c);
  });
  document.getElementById('inp-age').addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();const c=generate();render(c);}
  });
  document.getElementById('btn-text').addEventListener('click',()=>{
    if(!CHAR){toast('先にキャラクターを生成してください');return;}
    copy(toText(CHAR),'テキストをコピーしました');
  });
  document.getElementById('btn-coco').addEventListener('click',()=>{
    if(!CHAR){toast('先にキャラクターを生成してください');return;}
    copy(toCoco(CHAR),'ココフォリアの駒データをコピーしました');
  });
}

document.addEventListener('DOMContentLoaded',init);
